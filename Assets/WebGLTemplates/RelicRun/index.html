<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Relic Run</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #09191f; color: #f6f1df; font: 16px Arial, sans-serif; }
    body { display: grid; place-items: center; }
    #game { position: relative; width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16)); }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; background: #0d2229; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 15px; padding: 28px; background: #0d2229; text-align: center; }
    #loading[hidden], #error[hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(25px, 5vw, 45px); letter-spacing: .1em; font-weight: 600; }
    p { margin: 0; line-height: 1.45; color: #b8cfc8; }
    progress { width: min(300px, 60vw); height: 9px; margin: 6px auto; accent-color: #ffc555; }
    #error { position: absolute; inset: 0; display: grid; place-content: center; padding: 30px; background: #0d2229; text-align: center; }
    #error strong { font-size: 22px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <main id="game" aria-label="Relic Run game">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="Relic Run. A and D to move, Space to jump, O to shoot, B to change ammunition, L to teleport, K to attack, E to change portal route, Escape to pause."></canvas>
    <section id="loading" aria-live="polite">
      <h1>RELIC RUN</h1>
      <p>Three ruins. One expedition.</p>
      <progress id="progress" value="0" max="1" aria-label="Loading game"></progress>
      <p id="status">Loading the ruins...</p>
    </section>
    <section id="error" role="alert" hidden><strong>The game could not start.</strong><p id="error-message"></p></section>
  </main>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    function showError(message) {
      console.error(message);
      loading.hidden = true;
      document.getElementById('error-message').textContent = 'Please reload the page and use a desktop browser with WebGL 2 support. ' + String(message);
      document.getElementById('error').hidden = false;
    }
    const buildUrl = 'Build';
    const config = {
      dataUrl: buildUrl + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: buildUrl + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: buildUrl + '/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: buildUrl + '/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + '/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function(message, type) {
        if (type === 'error') showError(message);
        else console.warn(message);
      }
    };
    const script = document.createElement('script');
    script.src = buildUrl + '/{{{ LOADER_FILENAME }}}';
    script.onerror = function() { showError('The game loader did not download.'); };
    script.onload = function() {
      createUnityInstance(canvas, config, function(value) {
        progress.value = value;
        status.textContent = value < 0.9 ? 'Loading the ruins... ' + Math.round(value * 100) + '%' : 'Preparing the expedition...';
      }).then(function(instance) {
        window.unityInstance = instance;
        loading.hidden = true;
        canvas.focus();
      }).catch(showError);
    };
    canvas.addEventListener('pointerdown', function() { canvas.focus(); });
    canvas.addEventListener('contextmenu', function(event) { event.preventDefault(); });
    document.body.appendChild(script);
  </script>
</body>
</html>
